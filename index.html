<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Learn Deutsch</h1>

        <div class="selection-row">
            <div class="input-group">
                <label>Level:</label>
                <select id="levelSelect">
                    <option value="A1">A1</option>
                    <option value="A2">A2</option>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                </select>
            </div>
            <div class="input-group">
                <label>Range:</label>
                <select id="rangeSelect">
                    <option value="all">All</option>
                    <option value="0-50">1-50</option>
                    <option value="50-100">51-100</option>
                </select>
            </div>
        </div>

        <div class="card-container">
            <div class="card" id="card">
                <div class="card-front"><p id="germanText">Word</p></div>
                <div class="card-back"><p id="englishText">Meaning</p></div>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn">← Previous</button>
            <button id="nextBtn">Next →</button>
        </div>

        <div class="learning-controls">
            <button id="learnedBtn" class="success">I Know This! ✅</button>
            <button id="forgotBtn" class="danger">Study Again ❌</button>
        </div>

        <div class="stats">
            <p>Words left in this set: <span id="remainingCount">0</span></p>
            <button id="resetMastered">Reset Progress</button>
        </div>

        <hr>

        <div class="add-word-form">
            <h3>Add to Current Level</h3>
            <input type="text" id="newGerman" placeholder="German Word">
            <input type="text" id="newEnglish" placeholder="English Meaning">
            <button id="addBtn">Add Word</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
