<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Deutsch Words</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mein Wortschatz</h1>
        
        <div class="input-group">
            <label for="wordInput">German Word:</label>
            <input type="text" id="wordInput" placeholder="e.g. Tisch" required>
            
            <label for="genderSelect">Gender:</label>
            <select id="genderSelect">
                <option value="der">der (Masculine)</option>
                <option value="die">die (Feminine)</option>
                <option value="das">das (Neuter)</option>
            </select>
            
            <button id="addBtn">Add Word</button>
        </div>

        <ul id="wordList"></ul>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
