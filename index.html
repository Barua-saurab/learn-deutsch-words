<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Vocab Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>German Vocab Builder</h1>
        <nav>
            <button class="nav-btn" data-target="flashcard-section">Flashcards</button>
            <button class="nav-btn" data-target="quiz-section">Quiz</button>
            <button class="nav-btn" data-target="add-section">Add Word</button>
        </nav>
    </header>

    <main>
        <div class="deck-selector">
            <button class="deck-btn active" data-deck="b1">B1 Words</button>
            <button class="deck-btn" data-deck="b2">B2 Words</button>
            <button class="deck-btn" data-deck="myWords">My Words</button>
        </div>

        <section id="flashcard-section" class="view-section">
            <div class="card-container" id="flashcard">
                <div class="card-inner">
                    <div class="card-front">
                        <button id="btn-audio" title="Listen">🔊</button>
                        <h2 id="word-german">Loading...</h2>
                    </div>
                    <div class="card-back">
                        <h2 id="word-english"></h2>
                        <p id="word-example"></p>
                    </div>
                </div>
            </div>
            <div class="controls">
                <div class="nav-controls">
                    <button id="btn-prev">Previous</button>
                    <button id="btn-next">Next</button>
                </div>
                <div class="difficulty-controls">
                    <button class="diff-btn" data-level="easy">Easy</button>
                    <button class="diff-btn" data-level="medium">Medium</button>
                    <button class="diff-btn" data-level="hard">Hard</button>
                </div>
            </div>
        </section>

        <section id="quiz-section" class="view-section hidden">
            <h2>Quiz Mode</h2>
            <p>Score: <span id="quiz-score">0</span></p>
            <div class="quiz-card">
                <h3 id="quiz-word">Loading...</h3>
                <div id="quiz-options" class="options-grid"></div>
                <p id="quiz-feedback"></p>
                <button id="btn-next-quiz" class="hidden">Next Question</button>
            </div>
        </section>

        <section id="add-section" class="view-section hidden">
            <h2>Add Your Own Word</h2>
            <div class="add-form">
                <input type="text" id="new-german" placeholder="German Word (e.g. Apfel)">
                <input type="text" id="new-english" placeholder="English Translation (e.g. Apple)">
                <input type="text" id="new-example" placeholder="Example Sentence">
                <button id="btn-save-word">Save Word</button>
                <p id="save-msg"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
