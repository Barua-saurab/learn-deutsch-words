<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        /* --- FIREBASE SETUP --- */
        const firebaseConfig = {
            apiKey: "AIzaSyA8WpSREaEJkaagpDprjph1bnO7VDbx2cM",
            authDomain: "deutsch-web-app.firebaseapp.com",
            projectId: "deutsch-web-app",
            storageBucket: "deutsch-web-app.firebasestorage.app",
            messagingSenderId: "176553020022",
            appId: "1:176553020022:web:dec7a40d695fc00ae12d57",
            measurementId: "G-ESJ6F9ZZYP"
        };

        // Initialize Firebase and Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        /* --- STATE VARIABLES --- */
        let decks = {
            b1: [],
            b2: [],
            travel: [],
            food: [],
            myWords: [] // Will now be loaded from Firebase instead of local storage
        };

        let currentDeck = 'b1';
        let words = []; 
        let currentWordIndex = 0;
        let srsData = JSON.parse(localStorage.getItem('germanSrsData')) || {}; 
        let quizScore = 0;
        let currentQuizWord = null;

        /* --- FETCH DATA --- */
        function fetchAllDecks() {
            const t = new Date().getTime();
            Promise.all([
                fetch(`b1.json?v=${t}`).then(res => res.ok ? res.json() : []).catch(() => []),
                fetch(`b2.json?v=${t}`).then(res => res.ok ? res.json() : []).catch(() => []),
                fetch(`travel.json?v=${t}`).then(res => res.ok ? res.json() : []).catch(() => []),
                fetch(`food.json?v=${t}`).then(res => res.ok ? res.json() : []).catch(() => [])
            ]).then(([b1Data, b2Data, travelData, foodData]) => {
                decks.b1 = b1Data;
                decks.b2 = b2Data;
                decks.travel = travelData;
                decks.food = foodData;
                
                if (currentDeck !== 'myWords') {
                    words = decks[currentDeck];
                    loadNextFlashcard();
                }
            });
        }

        // Fetch custom words from Firebase
        async function fetchMyWordsFromFirebase() {
            try {
                const querySnapshot = await getDocs(collection(db, "myWords"));
                let onlineWords = [];
                querySnapshot.forEach((doc) => {
                    onlineWords.push(doc.data());
                });
                decks.myWords = onlineWords;
                
                if (currentDeck === 'myWords') {
                    words = decks.myWords;
                    loadNextFlashcard();
                }
            } catch (error) {
                console.error("Error fetching words:", error);
            }
        }

        /* --- DOM REFERENCES --- */
        const views = document.querySelectorAll('.view-section');
        const navBtns = document.querySelectorAll('.nav-btn');
        const deckBtns = document.querySelectorAll('.deck-btn');
        const flashcard = document.getElementById('flashcard');
        const wordGerman = document.getElementById('word-german');
        const wordEnglish = document.getElementById('word-english');
        const wordExample = document.getElementById('word-example');

        /* --- VIEW SWITCHING --- */
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                views.forEach(view => view.classList.add('hidden'));
                document.getElementById(btn.dataset.target).classList.remove('hidden');
                if (btn.dataset.target === 'quiz-section') loadQuizQuestion();
            });
        });

        /* --- DECK SWITCHING --- */
        deckBtns.forEach(btn => {
            if (btn.tagName === 'BUTTON') {
                btn.addEventListener('click', () => {
                    deckBtns.forEach(b => b.classList.remove('active'));
                    document.getElementById('theme-dropdown').value = "";
                    btn.classList.add('active');
                    currentDeck = btn.dataset.deck;
                    words = decks[currentDeck];
                    loadNextFlashcard();
                });
            }
        });

        document.getElementById('theme-dropdown').addEventListener('change', (e) => {
            const selectedTheme = e.target.value;
            if (selectedTheme) {
                deckBtns.forEach(b => b.classList.remove('active'));
                currentDeck = selectedTheme;
                words = decks[currentDeck];
                loadNextFlashcard();
            }
        });

        document.getElementById('external-link-btn').addEventListener('click', () => {
            window.open('https://barua-saurab.github.io/Deutsch/', '_blank');
        });

        /* --- FLASHCARDS --- */
        flashcard.addEventListener('click', () => flashcard.classList.toggle('flipped'));

        document.getElementById('btn-audio').addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (!words[currentWordIndex]) return;
            const utterance = new SpeechSynthesisUtterance(words[currentWordIndex].german);
            utterance.lang = 'de-DE';
            utterance.rate = 0.8; 
            window.speechSynthesis.speak(utterance);
        });

        function loadNextFlashcard() {
            if (!words || words.length === 0) {
                wordGerman.textContent = "No words here yet!";
                wordEnglish.textContent = `Add some words to this deck.`;
                wordExample.textContent = "";
                return;
            }
            
            let pool = [];
            words.forEach((word, index) => {
                let weight = srsData[word.german] || 2; 
                for (let i = 0; i < weight; i++) pool.push(index);
            });
            
            currentWordIndex = pool[Math.floor(Math.random() * pool.length)];
            updateFlashcardUI();
        }

        function updateFlashcardUI() {
            flashcard.classList.remove('flipped');
            const word = words[currentWordIndex];
            if (word) {
                wordGerman.textContent = word.german || "No German key";
                wordEnglish.textContent = word.english || "No English key";
                
                if (Array.isArray(word.example)) {
                    wordExample.textContent = word.example.join('\n');
                } else {
                    wordExample.textContent = word.example || "";
                }
            }
        }

        document.getElementById('btn-next').addEventListener('click', loadNextFlashcard);
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (words.length === 0) return;
            currentWordIndex = (currentWordIndex > 0) ? currentWordIndex - 1 : words.length - 1;
            updateFlashcardUI();
        });

        /* --- SRS --- */
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (!words || words.length === 0) return;
                const level = e.target.dataset.level;
                const currentWord = words[currentWordIndex].german;
                
                if (level === 'easy') srsData[currentWord] = 1;
                if (level === 'medium') srsData[currentWord] = 2;
                if (level === 'hard') srsData[currentWord] = 4;
                
                localStorage.setItem('germanSrsData', JSON.stringify(srsData));
                loadNextFlashcard();
            });
        });

        /* --- ADD WORD (NOW SAVES TO FIREBASE) --- */
        document.getElementById('btn-save-word').addEventListener('click', async () => {
            const ger = document.getElementById('new-german').value.trim();
            const eng = document.getElementById('new-english').value.trim();
            const ex = document.getElementById('new-example').value.trim();
            const msg = document.getElementById('save-msg');

            if (!ger || !eng) {
                msg.textContent = "German and English fields are required.";
                msg.style.color = "var(--danger)";
                return;
            }

            const newWord = { german: ger, english: eng, example: ex };
            msg.textContent = "Saving to database...";
            msg.style.color = "var(--warning)";

            try {
                // Save word to Firebase
                await addDoc(collection(db, "myWords"), newWord);
                
                // Add to local array so it updates immediately
                decks.myWords.push(newWord);
                if (currentDeck === 'myWords') words = decks.myWords;

                // Clear form
                document.getElementById('new-german').value = '';
                document.getElementById('new-english').value = '';
                document.getElementById('new-example').value = '';
                
                msg.textContent = "Word saved securely!";
                msg.style.color = "var(--success)";
                setTimeout(() => msg.textContent = "", 2000);
                
                if (currentDeck === 'myWords') loadNextFlashcard();
            } catch (error) {
                console.error("Error saving word:", error);
                msg.textContent = "Error saving. Check console.";
                msg.style.color = "var(--danger)";
            }
        });

        /* --- QUIZ --- */
        const quizWord = document.getElementById('quiz-word');
        const quizOptions = document.getElementById('quiz-options');
        const quizFeedback = document.getElementById('quiz-feedback');
        const quizScoreDisplay = document.getElementById('quiz-score');

        function loadQuizQuestion() {
            quizFeedback.textContent = '';
            document.getElementById('btn-next-quiz').classList.add('hidden');
            quizOptions.innerHTML = '';
            
            if (!words || words.length < 4) {
                quizWord.textContent = "Need at least 4 words in this deck to play.";
                return;
            }

            currentQuizWord = words[Math.floor(Math.random() * words.length)];
            quizWord.textContent = currentQuizWord.german;

            let options = [currentQuizWord.english];
            while (options.length < 4) {
                let randomWord = words[Math.floor(Math.random() * words.length)].english;
                if (!options.includes(randomWord)) options.push(randomWord);
            }

            options.sort(() => Math.random() - 0.5);

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.textContent = option;
                btn.addEventListener('click', () => handleQuizAnswer(btn, option));
                quizOptions.appendChild(btn);
            });
        }

        function handleQuizAnswer(btn, selected) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selected === currentQuizWord.english) {
                btn.classList.add('correct');
                quizFeedback.textContent = 'Correct! Gut gemacht!';
                quizFeedback.style.color = "var(--success)";
                quizScore++;
                srsData[currentQuizWord.german] = Math.max(1, (srsData[currentQuizWord.german] || 2) - 1); 
            } else {
                btn.classList.add('incorrect');
                quizFeedback.textContent = `Incorrect. Correct: ${currentQuizWord.english}`;
                quizFeedback.style.color = "var(--danger)";
                srsData[currentQuizWord.german] = (srsData[currentQuizWord.german] || 2) + 2; 
            }
            
            localStorage.setItem('germanSrsData', JSON.stringify(srsData));
            quizScoreDisplay.textContent = quizScore;
            document.getElementById('btn-next-quiz').classList.remove('hidden');
        }

        document.getElementById('btn-next-quiz').addEventListener('click', loadQuizQuestion);

        /* --- START --- */
        window.addEventListener('DOMContentLoaded', () => {
            fetchAllDecks(); 
            fetchMyWordsFromFirebase(); // Load synced words on startup
        });
    </script>
